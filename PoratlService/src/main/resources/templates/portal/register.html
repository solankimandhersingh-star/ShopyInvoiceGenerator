<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: content(~{::body})}">
<head>
    <title>Business Registration</title>

    <style>

        .theme-toggle{
            text-align:right;
            font-size:13px;
            margin-bottom:10px;
        }

        .dark body,
        .dark .register-bg{
            background: #0f172a !important;
        }

        .dark .reg-card{
            background:#111827;
            color:white;
            box-shadow:0 20px 35px rgba(255,255,255,.08);
        }

        .dark input,
        .dark textarea,
        .dark select{
            background:#020617;
            color:white;
            border:1px solid #374151;
        }

        .dark label{
            color:#cbd5e1;
        }

        .dark .btn-primary{
            background:#2563eb;
        }

        .dark .btn-outline-secondary{
            color:white;
            border-color:#4b5563;
        }


        .register-bg{
            background: linear-gradient(135deg,#dbeafe,#fce7f3);
            min-height: 100vh;
            padding-top: 30px;
        }

        .reg-container{
            max-width: 760px;
            margin: auto;
        }

        .reg-card{
            background: white;
            border-radius: 18px;
            padding: 26px 28px;
            box-shadow: 0 20px 35px rgba(0,0,0,.08);
        }

        .title{
            text-align:center;
            margin-bottom:5px;
        }

        .subtitle{
            text-align:center;
            font-size: 13px;
            color:#777;
            margin-bottom: 18px;
        }

        .section-heading{
            font-weight:600;
            margin: 10px 0;
        }

        .divider{
            border-top:1px dashed #e4e4e4;
            margin: 12px 0;
        }

        label{
            font-size:13px;
            margin-bottom:4px;
        }

    </style>


</head>

<body class="register-bg">

<div class="reg-container">

    <div class="reg-card">

        <h3 class="title">Business Registration</h3>
        <div class="theme-toggle">
            <label>
                <input type="checkbox" id="themeSwitch">
                🌙 Dark mode
            </label>
        </div>

        <p class="subtitle">
            Fill in the details — admin will review and approve your account.
        </p>

        <form th:action="@{/portal/register}" method="post" class="row g-3">

            <!-- PERSONAL -->
            <div class="section-heading">👤 Personal Details</div>

            <div class="col-md-6">
                <label>Full Name *</label>
                <input class="form-control" name="fullName" placeholder="Ex: Aman Kumar" required>
            </div>

            <div class="col-md-6">
                <label>Email</label>
                <input class="form-control" name="email" placeholder="example@mail.com">
            </div>

            <input class="form-control"
                   name="mobile"
                   id="mobile"
                   placeholder="9876543210"
                   maxlength="10"
                   pattern="[0-9]{10}"
                   required>

            <small id="mobileError" style="color:red;display:none;">
                Mobile number must be exactly 10 digits
            </small>



            <div class="divider"></div>

            <!-- ORG -->
            <div class="section-heading">🏢 Organisation Details</div>

            <div class="col-md-6">
                <label>Organisation Name *</label>
                <input class="form-control" name="orgName" placeholder="Ex: Blue Tea Shop" required>
            </div>

            <div class="col-md-6">
                <label>GST Number</label>
                <input class="form-control" name="gstNumber" placeholder="Optional">
            </div>

            <div class="col-12">
                <label>Address</label>
                <textarea class="form-control" rows="2" name="address"
                          placeholder="Street, Area, City"></textarea>
            </div>

            <div class="col-md-6">
                <label>Organisation Email</label>
                <input class="form-control" name="orgEmail" placeholder="org@gmail.com">
            </div>

            <div class="col-md-6">
                <label>Phone</label>
                <input class="form-control" name="phone" placeholder="Company phone">
            </div>

            <div class="col-md-6">
                <label>State Name</label>
                <input class="form-control" name="stateName" placeholder="Telangana">
            </div>

            <div class="col-md-6">
                <label>State Code</label>
                <input class="form-control" name="stateCode" placeholder="TG">
            </div>

            <div class="col-12 d-flex justify-content-between mt-3">
                <a class="btn btn-outline-secondary" th:href="@{/portal}">Cancel</a>
                <button class="btn btn-primary">Submit & Send For Approval</button>
            </div>

        </form>

    </div>

</div>

<script>
    const switcher = document.getElementById("themeSwitch");

    switcher.addEventListener("change", () => {
        document.documentElement.classList.toggle("dark");
    });
</script>

<script>
    const mobile = document.getElementById("mobile");
    const error = document.getElementById("mobileError");

    mobile.addEventListener("input", () => {

        if(/^[0-9]{10}$/.test(mobile.value)){
            error.style.display = "none";
            mobile.style.borderColor = "";
        } else {
            error.style.display = "block";
            mobile.style.borderColor = "red";
        }
    });
</script>



</body>

</html>
