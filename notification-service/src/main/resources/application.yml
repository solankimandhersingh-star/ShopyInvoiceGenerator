server:
  port: 8086

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/notification_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: yourgmail@gmail.com
    password: app-password-here
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
