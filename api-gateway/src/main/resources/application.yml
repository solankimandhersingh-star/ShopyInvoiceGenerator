server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        # Portal UI
        - id: PoratlService
          uri: http://localhost:8082
          predicates:
            - Path=/portal/**

        # Admin
        - id: admin-service
          uri: http://localhost:8081
          predicates:
            - Path=/admin/**

        # User
        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/user/**

        # Invoice
        - id: invoice-service
          uri: http://localhost:8084
          predicates:
            - Path=/invoice/**
          # Registration
        - id: registration-service
          uri: http://localhost:8085
          predicates:
            - Path=/registration/**