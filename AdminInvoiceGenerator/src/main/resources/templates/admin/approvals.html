<!-- src/main/resources/templates/admin/approvals.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: content(~{::body})}">
<head>
    <title>Approvals</title>
</head>

<body>

<div class="text-center mb-3">
    <h3 class="section-title">Approvals</h3>
    <div class="section-subtitle">Approve pending users and organisations</div>
</div>

<!-- Pending Registrations (from registration-service) -->
<div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
        <h5 class="section-title">Pending Registrations</h5>
        <p class="section-subtitle">Users waiting for admin approval</p>

        <div th:if="${#lists.isEmpty(pendingRegistrations)}"
             class="text-muted text-center">
            No pending registrations.
        </div>

        <div th:if="${!#lists.isEmpty(pendingRegistrations)}">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Organisation</th>
                    <th>Status</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="r : ${pendingRegistrations}">
                    <td th:text="${r.fullName}"></td>
                    <td th:text="${r.organisation.name}"></td>

                    <td class="text-end">
                        <form th:action="@{'/admin/approve/registration/' + ${r.id}}"
                              method="post"
                              class="d-inline">
                            <button class="btn btn-success btn-sm">Approve</button>
                        </form>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>

    </div>
</div>

<div class="grid-2">

    <!-- Pending Users (existing admin users not yet approved) -->
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <h5 class="section-title">Pending Users</h5>

            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                    <th>Org</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>

                <tbody>
                <tr th:each="u : ${pendingUsers}">
                    <td th:text="${u.username}"></td>

                    <td>
                        <span class="badge bg-info" th:text="${u.role}"></span>
                    </td>

                    <td th:text="${u.organisation != null ? u.organisation.name : 'N/A'}"></td>

                    <td class="text-end">
                        <form th:action="@{'/admin/approve/user/' + ${u.id}}"
                              method="post"
                              class="d-inline">
                            <button class="btn btn-success btn-sm">Approve</button>
                        </form>
                    </td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>

    <!-- Pending Organisations -->
    <div class="card border-0 shadow-sm">
        <div class="card-body">
            <h5 class="section-title">Pending Organisations</h5>

            <table class="table table-hover mb-0">
                <thead>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th class="text-end">Action</th>
                </tr>
                </thead>

                <tbody>
                <tbody>
                <tr th:each="o : ${pendingOrgs}">
                    <td th:text="${o.name}"></td>
                    <td>
                        <span class="badge status-pending">Pending</span>
                    </td>

                    <td class="text-end">
                        <form th:action="@{'/admin/approve/org/' + ${o.id}}" method="post">
                            <button class="btn btn-success btn-sm">Approve</button>
                        </form>
                    </td>
                </tr>
                </tbody>
                </tbody>

            </table>
        </div>
    </div>

</div>

<div class="text-center mt-3">
    <a class="btn btn-outline-secondary" th:href="@{/admin/dashboard}">
        Back to Dashboard
    </a>
</div>

</body>
</html>
