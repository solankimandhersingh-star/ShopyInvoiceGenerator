<!-- src/main/resources/templates/admin/dashboard.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: content(~{::body})}">
<head>
    <title>Dashboard</title>
</head>

<body>

    <div class="text-center mb-3">
        <h3 class="section-title">Admin Dashboard</h3>
        <div class="section-subtitle">Quick overview and actions</div>
    </div>

    <div class="d-flex justify-content-center mb-3 actions">
        <a class="btn btn-primary" th:href="@{/admin/new-user}">Add User</a>
        <a class="btn btn-outline-primary" th:href="@{/admin/invoices}">View Invoices</a>
        <a class="btn btn-outline-secondary" th:href="@{/admin/approvals}">Approvals</a>
        <a class="btn btn-outline-info" th:href="@{/admin/search-org}">
            Search Organisations
        </a>

    </div>

    <hr class="hr-soft">

    <div class="grid-2">

        <!-- Pending Users -->
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h5 class="section-title">Pending Users</h5>
                <p class="section-subtitle">Approve accounts to grant access</p>

                <div th:if="${#lists.isEmpty(pendingUsers)}"
                     class="text-muted text-center">
                    No pending users.
                </div>

                <div th:if="${!#lists.isEmpty(pendingUsers)}">
                    <table class="table table-hover mb-0">
                        <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Organisation</th>
                            <th>Status</th>
                            <th class="text-end">Action</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="u : ${pendingUsers}">
                            <td th:text="${u.username}"></td>

                            <td>
                                <span class="badge bg-info"
                                      th:text="${u.role}"></span>
                            </td>

                            <td th:text="${u.organisation != null ? u.organisation.name : 'N/A'}"></td>

                            <td>
                                <span class="badge status-pending">Pending</span>
                            </td>

                            <td class="text-end">
                                <form th:action="@{'/admin/approve/user/' + ${u.id}}"
                                      method="post"
                                      class="d-inline">
                                    <button class="btn btn-success btn-sm">Approve</button>
                                </form>
                            </td>
                        </tr>
                        </tbody>

                    </table>
                </div>

            </div>
        </div>

        <!-- Quick Actions -->
        <div class="card border-0 shadow-sm">
            <div class="card-body">
                <h5 class="section-title">Quick Actions</h5>
                <p class="section-subtitle">Common tasks</p>

                <div class="d-flex justify-content-center flex-wrap gap-3 mb-4">
                    <a class="btn btn-primary px-4" th:href="@{/admin/new-user}">Add User</a>
                    <a class="btn btn-outline-primary px-4" th:href="@{/admin/invoices}">View Invoices</a>
                    <a class="btn btn-outline-secondary px-4" th:href="@{/admin/approvals}">Approvals</a>
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
