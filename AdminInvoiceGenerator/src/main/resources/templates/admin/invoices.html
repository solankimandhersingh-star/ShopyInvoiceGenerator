<!-- src/main/resources/templates/admin/invoices.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: content(~{::body})}">
<head>
  <title>Invoices</title>
</head>

<body>

<div class="text-center mb-3">
  <h3 class="section-title">View Invoices</h3>
  <div class="section-subtitle">Search by organisation</div>
</div>

<form th:action="@{/admin/invoices}" method="get"
      class="row g-3 justify-content-center">

  <div class="col-10 col-md-8">
    <label class="form-label">Organisation</label>

    <input class="form-control"
           list="orgs"
           name="organisationName"
           th:value="${selectedOrg}"
           placeholder="Type to search...">

    <datalist id="orgs">
      <option th:each="o : ${organisations}"
              th:value="${o.name}"></option>
    </datalist>
  </div>

  <div class="col-10 col-md-8 d-flex justify-content-center">
    <button class="btn btn-primary">Search</button>
  </div>

</form>

<div class="row justify-content-center mt-3"
     th:if="${invoices}">

  <div class="col-12">
    <table class="table table-striped table-hover">
      <thead>
      <tr>
        <th>Invoice #</th>
        <th>Date</th>
        <th>Client</th>
        <th class="text-end">Grand Total</th>
      </tr>
      </thead>

      <tbody>
      <tr th:each="inv : ${invoices}">
        <td th:text="${inv.invoiceNumber}"></td>
        <td th:text="${inv.date}"></td>
        <td th:text="${inv.clientName}"></td>
        <td class="text-end" th:text="${inv.grandTotal}"></td>
      </tr>
      </tbody>
    </table>
  </div>

</div>

<div class="text-center mt-3">
  <a class="btn btn-outline-secondary" th:href="@{/admin/dashboard}">
    Back to Dashboard
  </a>
</div>

</body>
</html>
