<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Verify OTP</title>

  <style>
    body {
      background: linear-gradient(135deg,#141e30,#243b55);
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      font-family: Arial;
    }

    .card {
      background:#111827;
      color:white;
      padding:25px;
      width:350px;
      border-radius:14px;
      box-shadow:0 10px 25px rgba(0,0,0,.4);
    }

    input {
      width:100%;
      padding:10px;
      border-radius:5px;
      border:1px solid #374151;
      margin-top:8px;
      background:#0f172a;
      color:white;
    }

    button {
      margin-top:15px;
      width:100%;
      padding:10px;
      border:none;
      border-radius:6px;
      background:#6366f1;
      color:white;
      cursor:pointer;
    }

    .info { font-size:12px; color:#9ca3af; margin-top:6px; }
    .error { color:#f87171; margin-top:10px; }
    .success { color:#4ade80; margin-top:10px; }
  </style>
</head>

<body>

<div class="card">

  <h3>Verify OTP</h3>

  <p class="info">
    Enter the 6-digit OTP sent to your mobile / email.
  </p>

  <form th:action="@{/user/forgot-password/verify}" method="post">
    <input type="text" name="otp" placeholder="Enter OTP" required maxlength="6">

    <div th:if="${error}" class="error" th:text="${error}"></div>
    <div th:if="${message}" class="success" th:text="${message}"></div>

    <button type="submit">Verify</button>
  </form>

</div>

</body>
</html>
