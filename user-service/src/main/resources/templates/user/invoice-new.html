<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Create Invoice</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

    <style>
        body { background:#f4f6fb; }
        .wrapper{ max-width:1050px; margin:25px auto; }
        .card{ border-radius:14px;border:1px solid #e5e7eb;
            box-shadow:0 4px 14px rgba(0,0,0,.05);}
        table thead{background:#111827;color:white;}
        .summary-box{background:#f9fafb;border-radius:10px;padding:14px;border:1px solid #e5e7eb;}
    </style>
</head>

<body>

<div class="wrapper">

    <a th:href="@{/user/home}">⬅ Back</a>

    <div class="card p-4 mt-2">

        <h4>Create Invoice</h4>

        <form th:action="@{/user/invoice/new}" method="post">

            <!-- CLIENT -->
            <label class="fw-bold mt-2">Client</label>
            <select name="clientId" class="form-control mb-3">
                <option value="">-- Select Client --</option>

                <option th:each="c : ${clients}"
                        th:value="${c.id}"
                        th:text="${c.name}">
                </option>
            </select>


            <!-- OPTIONS TEMPLATE -->
            <select id="itemOptions" hidden>
                <option value="">-- Select --</option>

                <option th:each="i : ${items}"
                        th:value="${i.name}"
                        th:data-price="${i.price}"
                        th:text="${i.name}">
                </option>
            </select>


            <!-- ITEMS TABLE -->
            <label class="fw-bold">Items</label>

            <table class="table mt-2">
                <thead>
                <tr>
                    <th>Item</th>
                    <th width="140">Unit Price</th>
                    <th width="120">Qty</th>
                    <th width="150">Total</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="itemBody"></tbody>
            </table>

            <button type="button"
                    onclick="addRow()"
                    class="btn btn-outline-primary mb-3">
                + Add Item
            </button>


            <!-- GST SECTION -->
            <div class="summary-box mt-2">

                <h6 class="fw-bold">GST</h6>

                <div class="row mb-2">
                    <div class="col-md-4">
                        <label>CGST %</label>
                        <input id="cgstPercent" type="number" value="0" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label>SGST %</label>
                        <input id="sgstPercent" type="number" value="0" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label>IGST %</label>
                        <input id="igstPercent" type="number" value="0" class="form-control">
                    </div>
                </div>

                <hr>

                <!-- DISCOUNT -->
                <h6 class="fw-bold">Discount</h6>

                <div class="row mb-2">
                    <div class="col-md-4">
                        <label>Discount %</label>
                        <input id="discountPercent" type="number" value="0" class="form-control">
                    </div>

                    <div class="col-md-4">
                        <label>Discount Amount</label>
                        <input id="discountAmount" class="form-control" readonly>
                    </div>

                    <div class="col-md-4">
                        <label>Final Total</label>
                        <input id="total" class="form-control" readonly>
                    </div>
                </div>

                <hr>

                <!-- SUBTOTAL -->
                <div class="row">
                    <div class="col-md-4">
                        <label>Subtotal</label>
                        <input id="subtotal" class="form-control" readonly>
                    </div>
                </div>

            </div>


            <!-- HIDDEN FIELDS (sent to backend) -->
            <input type="hidden" name="subtotal" id="subtotalField">

            <input type="hidden" name="cgstPercent" id="cgstField">
            <input type="hidden" name="sgstPercent" id="sgstField">
            <input type="hidden" name="igstPercent" id="igstField">

            <input type="hidden" name="discountPercent" id="discountPercentField">
            <input type="hidden" name="discountAmount" id="discountField">

            <input type="hidden" name="totalAmount" id="totalField">


            <button class="btn btn-success mt-3 px-4">
                Save Invoice
            </button>

        </form>

    </div>
</div>


<script>
    function addRow() {

        const options = document.getElementById("itemOptions").innerHTML;

        const row = `
        <tr>
            <td>
                <select class="form-control itemName" name="itemName">
                    ${options}
                </select>
            </td>

            <td>
                <input class="form-control unitPrice" name="unitPrice" readonly>
            </td>

            <td>
                <input class="form-control qty" name="quantity"
                       type="number" min="1" value="1">
            </td>

            <td>
                <input class="form-control lineTotal" readonly>
            </td>

            <td>
                <button type="button"
                        class="btn btn-danger"
                        onclick="this.closest('tr').remove(); calculateTotals()">
                    X
                </button>
            </td>
        </tr>`;

        document.getElementById("itemBody")
            .insertAdjacentHTML("beforeend", row);

        bindEvents();
    }

    function bindEvents() {
        document.querySelectorAll(".itemName")
            .forEach(s => s.addEventListener("change", updateRow));

        document.querySelectorAll(".qty")
            .forEach(q => q.addEventListener("input", updateRow));

        document.querySelectorAll(
            "#cgstPercent,#sgstPercent,#igstPercent,#discountPercent"
        ).forEach(el => el.addEventListener("input", calculateTotals));
    }

    function updateRow(e) {
        const row = e.target.closest("tr");

        const sel = row.querySelector(".itemName");
        const price = row.querySelector(".unitPrice");
        const qty = row.querySelector(".qty");
        const line = row.querySelector(".lineTotal");

        const p = Number(sel.selectedOptions[0]?.dataset.price || 0);
        const q = Number(qty.value || 1);

        price.value = p.toFixed(2);
        line.value = (p * q).toFixed(2);

        calculateTotals();
    }

    function calculateTotals() {

        let subtotal = 0;

        document.querySelectorAll(".lineTotal")
            .forEach(i => subtotal += Number(i.value || 0));

        document.getElementById("subtotal").value = subtotal.toFixed(2);
        document.getElementById("subtotalField").value = subtotal;

        let cg = subtotal * (Number(cgstPercent.value) / 100);
        let sg = subtotal * (Number(sgstPercent.value) / 100);
        let ig = subtotal * (Number(igstPercent.value) / 100);

        let disc = (subtotal + cg + sg + ig)
            * (Number(discountPercent.value) / 100);

        discountAmount.value = disc.toFixed(2);
        discountField.value = disc;
        discountPercentField.value = discountPercent.value;

        const final = subtotal + cg + sg + ig - disc;

        total.value = final.toFixed(2);
        totalField.value = final;

        cgstField.value = cgstPercent.value;
        sgstField.value = sgstPercent.value;
        igstField.value = igstPercent.value;
    }
</script>

</body>
</html>
