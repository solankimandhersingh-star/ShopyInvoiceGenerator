<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Invoice</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>

<body class="bg-light">

<div class="container py-4">

    <a th:href="@{/user/invoice/list}" class="btn btn-outline-secondary mb-3">
        ⬅ Back
    </a>

    <div class="card p-4">

        <h4 th:text="${invoice.invoiceNumber}"></h4>
        <p class="text-muted" th:text="${invoice.date}"></p>

        <hr>

        <h6>Bill To</h6>
        <p>
            <span th:text="${invoice.clientName}"></span><br>
            <span th:text="${invoice.clientEmail}"></span><br>
            <span th:text="${invoice.clientPhone}"></span>
        </p>

        <hr>

        <h6>Amount Summary</h6>

        <table class="table">
            <tr>
                <th>Subtotal</th>
                <td th:text="${invoice.subtotal}"></td>
            </tr>

            <tr>
                <th>Total</th>
                <td th:text="${invoice.totalAmount}"></td>
            </tr>
        </table>

    </div>

</div>

</body>
</html>
