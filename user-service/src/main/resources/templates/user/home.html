<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>User Dashboard</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

    <style>
        body {
            min-height: 100vh;
            color: white;
            overflow: hidden;

            background: linear-gradient(270deg, #0f172a, #020617, #1f2937);
            background-size: 600% 600%;
            animation: gradientMove 14s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* animated fish background */
        .ocean {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            background: url('https://tse3.mm.bing.net/th/id/OIP.o0-_5Yz2Vr32GtIPXUKTLQHaEo?pid=Api&h=220&P=0') repeat;
            opacity: .15;
            background-size: 600px;
        }


        .sidebar {
            width: 260px;
            background: rgba(15,23,42,.7);
            border-right: 1px solid rgba(255,255,255,.1);
        }

        .sidebar a {
            color: #9ca3af;
            padding: 12px 18px;
            display: block;
            text-decoration: none;
        }

        .sidebar a:hover,
        .sidebar a.active {
            color: white;
            background: rgba(255,255,255,.08);
        }

        .content {
            padding: 28px;
        }
    </style>
</head>

<body>

<div class="ocean"></div>

<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar">
        <h5 class="p-3 text-white">User Panel</h5>

        <a th:href="@{/user/home}" class="active">Dashboard</a>
        <a th:href="@{/user/profile}">Profile</a>
        <a th:href="@{/user/clients}">Clients</a>
        <a th:href="@{/user/invoice/new}">Create Invoice</a>
        <a th:href="@{/user/invoice/list}">My Invoices</a>
        <a th:href="@{/user/items}">Items</a>
        <a th:href="@{/user/logout}">Logout</a>
    </div>

    <!-- Content -->
    <div class="content flex-grow-1">
        <h3>Welcome!</h3>
        <p>Your business workspace is ready.</p>

        <div class="mt-4 row g-3">
            <div class="col-md-4">
                <div class="card bg-dark text-white p-3">
                    <h6>Total Clients</h6>
                    <h3 th:text="${clientCount}">0</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card bg-dark text-white p-3">
                    <h6>Total Invoices</h6>
                    <h3 th:text="${invoiceCount}">0</h3>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card bg-dark text-white p-3">
                    <h6>Pending Payments</h6>
                    <h3 th:text="${pendingPayments}">0</h3>


                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
