<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Invoices</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="d-flex justify-content-between mb-3">
        <a th:href="@{/user/home}" class="btn btn-outline-secondary">⬅ Back</a>
        <h4>My Invoices</h4>
    </div>

    <!-- FILTER BAR -->
    <form method="get" class="row g-2 mb-3">

        <div class="col-md-4">
            <input class="form-control"
                   name="search"
                   placeholder="Search by invoice number..."
                   th:value="${search}">
        </div>

        <div class="col-md-4">
            <select name="client"
                    class="form-control">
                <option value="">All Clients</option>

                <option th:each="c : ${clients}"
                        th:value="${c.name}"
                        th:selected="${clientFilter == c.name}"
                        th:text="${c.name}">
                </option>
            </select>
        </div>

        <div class="col-md-2">
            <button class="btn btn-primary w-100">Filter</button>
        </div>
    </form>

    <!-- INVOICE TABLE -->
    <table class="table table-bordered bg-white">
        <thead class="table-light">
        <tr>
            <th>S.no</th>
            <th>Date</th>
            <th>Invoice No</th>
            <th>Client</th>
            <th>Total</th>
            <th>View Invoice</th>
            <th>Status</th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="inv,stat : ${invoices}">
            <td th:text="${stat.index + 1}"></td>

            <td th:text="${inv.date}"></td>

            <!-- link to open invoice -->
            <td>
                <a th:href="@{'/user/invoice/view/' + ${inv.id}}"
                   th:text="${inv.invoiceNumber}">
                </a>
            </td>

            <td th:text="${inv.clientName}"></td>


            <td th:text="${inv.totalAmount}"></td>

            <td>
                <a th:href="@{'/user/invoice/view/pdf/' + ${inv.id}}"
                   target="_blank"
                   class="btn btn-sm btn-outline-primary">
                    View Invoice
                </a>
            </td>


            <td>
                <span class="badge bg-success"
                      th:if="${inv.status == 'PAID'}">PAID</span>

                <span class="badge bg-warning text-dark"
                      th:if="${inv.status == 'UNPAID'}">UNPAID</span>
            </td>
        </tr>
        </tbody>

    </table>

</div>

</body>
</html>
