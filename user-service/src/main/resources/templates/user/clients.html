<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Clients</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>

<body class="bg-dark text-white">

<div class="container py-4">

    <a th:href="@{/user/home}" class="text-info mb-3 d-inline-block">⬅ Back</a>

    <div class="d-flex justify-content-between mb-3">
        <h4>Clients</h4>

        <a class="btn btn-primary"
           th:href="@{/user/clients/new}">
            + Add Client
        </a>
    </div>

    <table class="table table-dark table-hover">
        <thead>
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th></th>
        </tr>
        </thead>

        <tbody>
        <tr th:each="c : ${clients}">
            <td th:text="${c.name}"></td>
            <td th:text="${c.email}"></td>
            <td th:text="${c.phone}"></td>

            <td class="text-end">
                <a th:href="@{'/user/clients/edit/' + ${c.id}}"
                   class="btn btn-sm btn-warning">Edit</a>

                <a th:href="@{'/user/clients/delete/' + ${c.id}}"
                   class="btn btn-sm btn-danger"
                   onclick="return confirm('Delete client?')">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>

</div>

</body>
</html>
