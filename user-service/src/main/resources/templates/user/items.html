<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Items</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
</head>

<body class="p-4">

<h4>Items</h4>

<form th:action="@{/user/items}" method="post" class="row g-2 mb-3">

    <div class="col-md-4">
        <input class="form-control" name="name" placeholder="Item name" required>
    </div>

    <div class="col-md-3">
        <input class="form-control" type="number" name="price"
               placeholder="Price" step="0.01" required>
    </div>

    <div class="col-md-3">
        <input class="form-control" name="unit" placeholder="per piece / kg / hour">
    </div>

    <div class="col-md-2">
        <button class="btn btn-primary w-100">Add</button>
    </div>


</form>

<table class="table table-dark">
    <tr>
        <th>Name</th>
        <th>Price</th>
        <th>Unit</th>
    </tr>

    <tr th:each="i : ${items}">
        <td th:text="${i.name}"/>
        <td th:text="${i.price}"/>
        <td th:text="${i.unit}"/>
    </tr>
</table>

<a th:href="@{/user/home}" class="btn btn-outline-secondary mb-3">⬅ Back</a>

</body>
</html>
