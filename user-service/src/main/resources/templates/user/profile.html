<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>User Profile</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>

    <style>
        body {
            min-height: 100vh;
            background: #0b1220;
            color: #111827;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
        }

        h4 {
            color: #111827;
            font-weight: 700;
        }

        label {
            color: #374151;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .section-title {
            font-weight: 600;
            color: #1f2937;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        .readonly {
            background: #f3f4f6 !important;
            color: #6b7280;
        }

        .form-control,
        textarea {
            border-radius: 10px;
        }
    </style>

</head>

<body>

<div class="container py-4">

    <a th:href="@{/user/home}" class="text-info mb-3 d-inline-block">⬅ Back</a>

    <div class="card p-4">

        <h4 class="mb-3">Profile</h4>
        <p class="text-muted mb-4">View and update your business information.</p>

        <form th:action="@{/user/profile}" method="post" id="profileForm">

            <!------------ USER INFO ------------>
            <h6 class="mb-2">User Details</h6>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Username</label>
                    <input class="form-control readonly"
                           name="username"
                           th:value="${profile.username}"
                           readonly>
                </div>

                <div class="col-md-6">
                    <label>Mobile</label>
                    <input class="form-control editable"
                           name="mobile"
                           th:value="${profile.mobile}">
                </div>
            </div>

            <!------------ ORG INFO ------------>
            <h6 class="mb-2 mt-3">Organisation</h6>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Name</label>
                    <input class="form-control editable"
                           name="name"
                           th:value="${profile.name}">
                </div>

                <div class="col-md-6">
                    <label>Email</label>
                    <input class="form-control editable"
                           name="email"
                           th:value="${profile.email}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Phone</label>
                    <input class="form-control editable"
                           name="phone"
                           th:value="${profile.phone}">
                </div>

                <div class="col-md-6">
                    <label>Address</label>
                    <textarea class="form-control editable"
                              name="address"
                              rows="2"
                              th:text="${profile.address}"></textarea>
                </div>

            </div>

            <h6 class="section-title">Bank Details</h6>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Bank Name</label>
                    <input class="form-control editable"
                           name="bankName"
                           th:value="${profile.bankName}">
                </div>

                <div class="col-md-6">
                    <label>Account Holder</label>
                    <input class="form-control editable"
                           name="accountHolder"
                           th:value="${profile.accountHolder}">
                </div>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>Account Number</label>
                    <input class="form-control editable"
                           name="accountNumber"
                           th:value="${profile.accountNumber}">
                </div>

                <div class="col-md-6">
                    <label>IFSC</label>
                    <input class="form-control editable"
                           name="ifsc"
                           th:value="${profile.ifsc}">
                </div>
            </div>

            <h6 class="section-title">UPI Details</h6>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label>UPI ID</label>
                    <input class="form-control editable"
                           name="upiId"
                           th:value="${profile.upiId}">
                </div>
            </div>


            <div class="d-flex gap-2 mt-3">
                <button type="button"
                        class="btn btn-outline-warning"
                        id="editBtn">
                    Edit
                </button>

                <button class="btn btn-success d-none"
                        id="saveBtn">
                    Save Changes
                </button>
            </div>

        </form>


    </div>

</div>

<script>
    const editBtn = document.getElementById("editBtn");
    const saveBtn = document.getElementById("saveBtn");
    const editableFields = document.querySelectorAll(".editable");

    editBtn.addEventListener("click", () => {
        editableFields.forEach(f => f.removeAttribute("readonly"));
        saveBtn.classList.remove("d-none");
        editBtn.classList.add("d-none");
    });

    saveBtn.addEventListener("click", () => {
        document.getElementById("profileForm").submit();
    });
</script>


</body>
</html>
